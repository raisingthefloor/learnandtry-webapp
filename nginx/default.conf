# Search engines must never index the preview site but must index production.
# This same file ships in both the preview- and main-built images, so the
# policy is chosen per-request by hostname: preview hosts get a noindex header
# on every response; any other host (learnandtry.org, www.learnandtry.org)
# maps to "" and nginx omits the header entirely.
map $host $robots_tag {
    default                       "";
    preview.learnandtry.org       "noindex, nofollow";
    www.preview.learnandtry.org   "noindex, nofollow";
}

server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    # disable absolute_redirect so that folder paths without '/'s resolve as expected
    absolute_redirect off;

    # 'always' = attach the header even to error responses (404s etc.)
    add_header X-Robots-Tag $robots_tag always;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
    }

    # redirect server error pages to the static page /50x.html
    #
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
